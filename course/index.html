<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flutter 全量语音教程</title>
    <link rel="stylesheet" href="player.css" />
  </head>
  <body>
    <div class="app" id="app">
      <aside class="catalog" id="catalog" aria-label="课程目录">
        <div class="brand">
          <p class="eyebrow">语音教程</p>
          <h1>Flutter 全量</h1>
          <p id="progress-label">正在读取课程</p>
          <button class="text-button mobile-only" id="catalog-close" type="button">关闭目录</button>
        </div>
        <nav id="catalog-nav"></nav>
      </aside>
      <main class="lesson">
        <header class="topbar">
          <button class="text-button mobile-only" id="catalog-open" type="button">目录</button>
          <div class="titles">
            <p class="eyebrow" id="module-label"></p>
            <h2 id="lesson-title">课程加载中</h2>
          </div>
          <p class="segment-count" id="segment-count"></p>
        </header>
        <div id="banner" class="banner" hidden role="alert"></div>
        <section id="stage" class="stage" aria-label="图示"></section>
        <section id="transcript" class="transcript" aria-label="口播文稿"></section>
        <footer class="controls">
          <div class="transport">
            <button id="prev-segment" type="button">上一段</button>
            <button id="play" class="play" type="button">播放</button>
            <button id="next-segment" type="button">下一段</button>
          </div>
          <div class="speeds" role="group" aria-label="倍速">
            <button type="button" data-rate="0.75">0.75×</button>
            <button type="button" data-rate="1" aria-pressed="true">1×</button>
            <button type="button" data-rate="1.25">1.25×</button>
            <button type="button" data-rate="1.5">1.5×</button>
          </div>
          <div class="lesson-nav">
            <button id="prev-lesson" type="button">上一课</button>
            <button id="next-lesson" type="button">下一课</button>
            <p id="nav-note" class="nav-note"></p>
          </div>
        </footer>
      </main>
    </div>
    <script src="visuals.js"></script>
    <script src="player.js"></script>
  </body>
</html>
